<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treezo – Contact & Catalogs</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#f4f7f5;color:#1f2a26;line-height:1.5;padding:16px;
  }
  .wrap{max-width:520px;margin:0 auto;}
  .brand{
    background:#157a52;color:#fff;border-radius:14px 14px 0 0;
    padding:16px 18px;display:flex;align-items:center;justify-content:center;
  }
  .brand .name{font-size:22px;font-weight:700;letter-spacing:.5px}
  .card{
    background:#fff;border-radius:0 0 14px 14px;
    box-shadow:0 6px 24px rgba(0,0,0,.08);padding:24px 18px 28px;
  }
  h1{font-size:20px;color:#0f5e3f;margin-bottom:6px;text-align:center}
  p.lead{color:#6b7a73;font-size:14px;margin-bottom:20px;text-align:center}
  .wa{
    display:flex;align-items:center;justify-content:center;gap:12px;
    text-decoration:none;color:#fff;font-weight:600;font-size:17px;
    background:#25D366;padding:17px 16px;border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.12);margin-bottom:22px;
  }
  .wa:active{transform:translateY(1px)}
  .wa svg{width:24px;height:24px;flex:0 0 24px}
  .divider{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:#e2e8e4}
  .divider span{font-size:13px;color:#6b7a73;font-weight:600;white-space:nowrap}
  .list{display:flex;flex-direction:column;gap:12px}
  .item{
    display:flex;align-items:center;gap:14px;
    text-decoration:none;color:#0f5e3f;font-weight:600;font-size:16px;
    background:#fff;border:2px solid #d8e5de;padding:15px 16px;border-radius:12px;
  }
  .item:active{transform:translateY(1px);background:#f4f9f6}
  .item .ico{
    width:38px;height:38px;flex:0 0 38px;border-radius:9px;
    background:#157a52;color:#fff;display:flex;align-items:center;justify-content:center;
  }
  .item .ico svg{width:20px;height:20px}
  .item .txt{display:flex;flex-direction:column;line-height:1.25}
  .item .txt small{font-weight:400;color:#6b7a73;font-size:12px}
  footer{text-align:center;color:#6b7a73;font-size:12px;margin-top:18px}
</style>
</head>
